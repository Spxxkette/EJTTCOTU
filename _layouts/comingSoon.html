<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>{{page.title}}</title>
    <link rel="stylesheet" href="assets/css/style.css">



    <style>
        body, html{

            height: 100%;
            margin: 0;

        }

        .bg{

            position: relative;
           

            background-image: url('assets/images/fachrizal-maulana-IF6hfEoe6FM-unsplash.jpg');
            height: 100%;
            
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover ;
        }


        .centered{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            text-align: center;
            color: white;
        }
    </style>


    </head>

    <body>
    <div class="bg">
    </div>
  
    <div class="centered">
        {{content}}
    </div>

    </body>

</html>
